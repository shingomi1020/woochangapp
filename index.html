<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <header class="hero reveal">
        <div class="hero-copy-wrap">
          <div class="hero-badge">
            <span class="icon-chip">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 3h10v2h3a1 1 0 0 1 1 1v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1h3V3Zm2 2h6V5H9v0Zm10 2H5v12h14V7ZM7 10h10v2H7v-2Zm0 4h7v2H7v-2Z" />
              </svg>
            </span>
            <p class="eyebrow">&#xc5c5;&#xbb34; + &#xce98;&#xb9b0;&#xb354; &#xc6cc;&#xd06c;&#xc2a4;&#xd398;&#xc774;&#xc2a4;</p>
          </div>
          <h1>FlowBoard</h1>
          <p class="hero-copy">
            &#xd560; &#xc77c;&#xacfc; &#xc77c;&#xc815;&#xc744; &#xd55c; &#xd654;&#xba74;&#xc5d0;&#xc11c; &#xbcf4;&#xace0;
            &#xc815;&#xb9ac;&#xd560; &#xc218; &#xc788;&#xb294; &#xc9d1;&#xc911;&#xd615; &#xc5c5;&#xbb34; &#xbcf4;&#xb4dc;
          </p>
          <div class="hero-actions">
            <button id="focusTodayBtn" class="hero-btn primary" type="button">
              <span class="btn-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v12a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a2 2 0 0 1 2-2h3V2Zm13 8H4v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8ZM6 8h12V6H6v2Zm5 4h2v4h-2v-4Z" />
                </svg>
              </span>
              &#xc624;&#xb298; &#xbcf4;&#xae30;
            </button>
            <button id="focusInputBtn" class="hero-btn secondary" type="button">
              <span class="btn-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z" />
                </svg>
              </span>
              &#xbe60;&#xb978; &#xc5c5;&#xbb34; &#xcd94;&#xac00;
            </button>
          </div>
        </div>

        <div class="hero-meta">
          <div class="metric-card float-card">
            <span class="metric-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm10 1.5V8h3.5L15 4.5ZM7 11h10v1.8H7V11Zm0 4h10v1.8H7V15Z" />
              </svg>
            </span>
            <span class="metric-label">&#xb0a8;&#xc740; &#xc5c5;&#xbb34;</span>
            <strong id="remainingCount">0</strong>
            <small>&#xc624;&#xb298; &#xcc98;&#xb9ac;&#xd574;&#xc57c; &#xd560; &#xd575;&#xc2ec; &#xc791;&#xc5c5;</small>
          </div>
          <div class="metric-card float-card delay-1">
            <span class="metric-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v12a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a2 2 0 0 1 2-2h3V2Zm13 8H4v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8ZM6 8h12V6H6v2Z" />
              </svg>
            </span>
            <span class="metric-label">&#xc774;&#xbc88; &#xb2ec; &#xc77c;&#xc815;</span>
            <strong id="monthEventCount">0</strong>
            <small>&#xd604;&#xc7ac; &#xbcf4;&#xb294; &#xb2ec;&#xc5d0; &#xb4f1;&#xb85d;&#xb41c; &#xc77c;&#xc815; &#xc218;</small>
          </div>
          <div class="metric-card float-card delay-2">
            <span class="metric-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 4a1 1 0 0 0-1 1v5.4c0 .3.12.58.33.79l3.6 3.6 1.41-1.42L13 11.99V7a1 1 0 0 0-1-1Z" />
              </svg>
            </span>
            <span class="metric-label">&#xc120;&#xd0dd;&#xd55c; &#xb0a0;&#xc9dc;</span>
            <strong id="selectedDaySummary">0</strong>
            <small>&#xd574;&#xb2f9; &#xb0a0;&#xc9dc;&#xc5d0; &#xc788;&#xb294; &#xc77c;&#xc815; &#xc218;</small>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel panel-calendar reveal delay-1">
          <div class="panel-head">
            <div>
              <p class="section-label">&#xce98;&#xb9b0;&#xb354;</p>
              <h2 id="monthLabel">2026&#xb144; 3&#xc6d4;</h2>
            </div>
            <div class="calendar-nav">
              <button id="prevMonthBtn" class="ghost-btn" type="button">&#xc774;&#xc804;</button>
              <button id="todayBtn" class="ghost-btn primary" type="button">&#xc624;&#xb298;</button>
              <button id="nextMonthBtn" class="ghost-btn" type="button">&#xb2e4;&#xc74c;</button>
            </div>
          </div>

          <div class="calendar-topline">
            <p id="calendarHint" class="calendar-hint">&#xc624;&#xb298; &#xc77c;&#xc815;&#xc744; &#xba3c;&#xc800; &#xd655;&#xc778;&#xd574; &#xbcf4;&#xc138;&#xc694;.</p>
            <button id="openEventModalBtn" class="ghost-btn icon-only" type="button" aria-label="&#xc77c;&#xc815; &#xcd94;&#xac00;">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z" />
              </svg>
            </button>
          </div>

          <div class="weekdays" aria-hidden="true">
            <span>&#xc77c;</span>
            <span>&#xc6d4;</span>
            <span>&#xd654;</span>
            <span>&#xc218;</span>
            <span>&#xbaa9;</span>
            <span>&#xae08;</span>
            <span>&#xd1a0;</span>
          </div>

          <div id="calendarGrid" class="calendar-grid" aria-label="&#xc6d4;&#xac04; &#xce98;&#xb9b0;&#xb354;"></div>

          <div class="schedule-card">
            <div class="schedule-head">
              <div>
                <p class="section-label">&#xc120;&#xd0dd;&#xd55c; &#xb0a0;</p>
                <h3 id="selectedDateLabel"></h3>
              </div>
              <div class="schedule-actions">
                <span id="selectedDateCount" class="badge"></span>
                <button id="selectedDateAddBtn" class="ghost-btn" type="button">&#xc77c;&#xc815; &#xcd94;&#xac00;</button>
              </div>
            </div>
            <div id="selectedDateEvents" class="schedule-list"></div>
          </div>
        </section>

        <section class="panel panel-tasks reveal delay-2">
          <div class="panel-head">
            <div>
              <p class="section-label">&#xd22c;&#xb450;&#xb9ac;&#xc2a4;&#xd2b8;</p>
              <h2>&#xc624;&#xb298;&#xc758; &#xd560; &#xc77c;</h2>
            </div>
            <div class="task-filter" role="tablist" aria-label="&#xd560; &#xc77c; &#xd544;&#xd130;">
              <button class="chip active" data-filter="all" type="button">&#xc804;&#xccb4;</button>
              <button class="chip" data-filter="todo" type="button">&#xc9c4;&#xd589;&#xc911;</button>
              <button class="chip" data-filter="done" type="button">&#xc644;&#xb8cc;</button>
            </div>
          </div>

          <div class="task-toolbar">
            <form id="taskForm" class="task-form">
              <input
                id="taskInput"
                type="text"
                placeholder="&#xc0c8; &#xc5c5;&#xbb34;&#xb97c; &#xc785;&#xb825;&#xd558;&#xc138;&#xc694;"
                maxlength="60"
                autocomplete="off"
                required
              />
              <button type="submit" class="submit-btn">&#xcd94;&#xac00;</button>
            </form>
            <div class="task-summary">
              <span id="taskProgressLabel">0 / 0 &#xc644;&#xb8cc;</span>
              <div class="progress-track" aria-hidden="true">
                <div id="taskProgressBar" class="progress-fill"></div>
              </div>
            </div>
          </div>

          <div id="taskList" class="task-list"></div>
        </section>
      </main>
    </div>

    <div id="eventModal" class="modal" aria-hidden="true">
      <div id="eventModalBackdrop" class="modal-backdrop"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
        <div class="modal-head">
          <div>
            <p class="section-label">&#xc77c;&#xc815; &#xd3b8;&#xc9d1;</p>
            <h3 id="eventModalTitle">&#xc0c8; &#xc77c;&#xc815; &#xcd94;&#xac00;</h3>
          </div>
          <button id="closeEventModalBtn" class="ghost-btn icon-only" type="button" aria-label="&#xb2eb;&#xae30;">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z" />
            </svg>
          </button>
        </div>

        <form id="eventForm" class="event-form">
          <input id="eventIdInput" type="hidden" />

          <label class="field">
            <span>&#xc81c;&#xbaa9;</span>
            <input id="eventTitleInput" type="text" maxlength="60" required />
          </label>

          <div class="field-row">
            <label class="field">
              <span>&#xb0a0;&#xc9dc;</span>
              <input id="eventDateInput" type="date" required />
            </label>
            <label class="field">
              <span>&#xc2dc;&#xac04;</span>
              <input id="eventTimeInput" type="time" required />
            </label>
          </div>

          <label class="field">
            <span>&#xd0dc;&#xadf8;</span>
            <input id="eventTagInput" type="text" maxlength="24" placeholder="Planning, Client, Team..." required />
          </label>

          <div class="modal-actions">
            <button id="deleteEventBtn" class="ghost-btn danger hidden" type="button">&#xc0ad;&#xc81c;</button>
            <div class="modal-submit-group">
              <button id="cancelEventBtn" class="ghost-btn" type="button">&#xcde8;&#xc18c;</button>
              <button type="submit" class="submit-btn">&#xc800;&#xc7a5;</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
  </body>
</html>
